name: CI
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python tools/verify_v6_integrity.py
      - run: python tools/verify_windows_release.py
      - run: python tools/verify_release.py --passes 1
  linux-tk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements.txt
      - run: xvfb-run -a python -m pytest -q
